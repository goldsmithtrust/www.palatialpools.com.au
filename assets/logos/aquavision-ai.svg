<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="av-bg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#2e0a52"/>
      <stop offset="100%" style="stop-color:#0d0118"/>
    </radialGradient>
    <linearGradient id="av-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe085"/>
      <stop offset="50%" style="stop-color:#C5A55A"/>
      <stop offset="100%" style="stop-color:#a07830"/>
    </linearGradient>
    <radialGradient id="av-iris" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffe085"/>
      <stop offset="45%" style="stop-color:#C5A55A"/>
      <stop offset="100%" style="stop-color:#7a5520"/>
    </radialGradient>
    <filter id="av-glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="av-glow-strong">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="av-clip">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>

  <!-- Deep dark background with radial highlight -->
  <circle cx="256" cy="256" r="256" fill="url(#av-bg)"/>
  <!-- Outer gold ring — thick -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#C5A55A" stroke-width="8"/>

  <!-- Eye shape glow layer -->
  <path d="M 22 256 Q 256 60 490 256 Q 256 452 22 256 Z"
        fill="rgba(197,165,90,0.18)" clip-path="url(#av-clip)"/>
  <!-- Eye outline — thick bold stroke -->
  <path d="M 22 256 Q 256 60 490 256 Q 256 452 22 256 Z"
        fill="none" stroke="#C5A55A" stroke-width="10"
        filter="url(#av-glow)" clip-path="url(#av-clip)"/>

  <!-- Iris outer glow ring -->
  <circle cx="256" cy="256" r="104" fill="rgba(197,165,90,0.22)" filter="url(#av-glow-strong)"/>
  <!-- Iris outer border — thick -->
  <circle cx="256" cy="256" r="104" fill="none" stroke="#ffe085" stroke-width="7"/>
  <!-- Iris fill -->
  <circle cx="256" cy="256" r="94" fill="url(#av-iris)"/>
  <!-- Iris inner ring detail -->
  <circle cx="256" cy="256" r="78" fill="none" stroke="rgba(10,0,20,0.55)" stroke-width="3.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="rgba(10,0,20,0.4)" stroke-width="2.5"/>

  <!-- Pupil — deep dark -->
  <circle cx="256" cy="256" r="42" fill="#0d0118"/>

  <!-- Aperture blades — bold, solid -->
  <path d="M 256 214 L 278 248 L 256 240 Z" fill="#ffe085"/>
  <path d="M 295 232 L 278 266 L 264 250 Z" fill="#ffe085"/>
  <path d="M 295 280 L 264 262 L 278 246 Z" fill="#ffe085"/>
  <path d="M 256 298 L 234 264 L 256 272 Z" fill="#ffe085"/>
  <path d="M 217 280 L 248 262 L 234 278 Z" fill="#ffe085"/>
  <path d="M 217 232 L 234 250 L 248 266 Z" fill="#ffe085"/>

  <!-- Highlight reflection -->
  <circle cx="234" cy="232" r="13" fill="white" opacity="0.45"/>
  <circle cx="242" cy="225" r="6" fill="white" opacity="0.25"/>

  <!-- Corner analysis brackets — thick, bold -->
  <path d="M 48 136 L 48 88 L 96 88" fill="none" stroke="#C5A55A" stroke-width="9" stroke-linecap="round"/>
  <path d="M 464 136 L 464 88 L 416 88" fill="none" stroke="#C5A55A" stroke-width="9" stroke-linecap="round"/>
  <path d="M 48 376 L 48 424 L 96 424" fill="none" stroke="#C5A55A" stroke-width="9" stroke-linecap="round"/>
  <path d="M 464 376 L 464 424 L 416 424" fill="none" stroke="#C5A55A" stroke-width="9" stroke-linecap="round"/>

  <!-- Scan lines — thick, visible -->
  <line x1="60" y1="208" x2="148" y2="208" stroke="#C5A55A" stroke-width="5" opacity="0.7"/>
  <line x1="60" y1="228" x2="128" y2="228" stroke="#C5A55A" stroke-width="4" opacity="0.5"/>
  <line x1="364" y1="284" x2="452" y2="284" stroke="#C5A55A" stroke-width="5" opacity="0.7"/>
  <line x1="384" y1="304" x2="452" y2="304" stroke="#C5A55A" stroke-width="4" opacity="0.5"/>

  <!-- AI dot grid — bold dots -->
  <circle cx="106" cy="158" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="126" cy="158" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="106" cy="178" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="126" cy="178" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="386" cy="330" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="406" cy="330" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="386" cy="350" r="5" fill="#C5A55A" opacity="0.65"/>
  <circle cx="406" cy="350" r="5" fill="#C5A55A" opacity="0.65"/>
</svg>
