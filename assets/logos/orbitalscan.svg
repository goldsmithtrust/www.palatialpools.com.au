<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="os-bg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#2e0a52"/>
      <stop offset="100%" style="stop-color:#0d0118"/>
    </radialGradient>
    <radialGradient id="os-globe" cx="38%" cy="34%" r="60%">
      <stop offset="0%" style="stop-color:rgba(197,165,90,0.35)"/>
      <stop offset="100%" style="stop-color:rgba(197,165,90,0.06)"/>
    </radialGradient>
    <filter id="os-glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="os-glow-strong">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="os-globe-clip">
      <circle cx="256" cy="272" r="152"/>
    </clipPath>
  </defs>

  <!-- Deep dark background -->
  <circle cx="256" cy="256" r="256" fill="url(#os-bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#C5A55A" stroke-width="8"/>

  <!-- Globe glow -->
  <circle cx="256" cy="272" r="152" fill="rgba(197,165,90,0.20)" filter="url(#os-glow-strong)"/>
  <!-- Globe body — thick border -->
  <circle cx="256" cy="272" r="152" fill="url(#os-globe)" stroke="#C5A55A" stroke-width="7"/>

  <!-- Globe latitude lines — thicker -->
  <ellipse cx="256" cy="272" rx="152" ry="54" fill="none" stroke="#C5A55A" stroke-width="3" opacity="0.45" clip-path="url(#os-globe-clip)"/>
  <ellipse cx="256" cy="272" rx="152" ry="104" fill="none" stroke="#C5A55A" stroke-width="3" opacity="0.45" clip-path="url(#os-globe-clip)"/>
  <!-- Globe longitude lines — thicker -->
  <ellipse cx="256" cy="272" rx="54"  ry="152" fill="none" stroke="#C5A55A" stroke-width="3" opacity="0.45" clip-path="url(#os-globe-clip)"/>
  <ellipse cx="256" cy="272" rx="104" ry="152" fill="none" stroke="#C5A55A" stroke-width="3" opacity="0.45" clip-path="url(#os-globe-clip)"/>
  <!-- Equator — bold -->
  <line x1="104" y1="272" x2="408" y2="272" stroke="#C5A55A" stroke-width="4" opacity="0.5" clip-path="url(#os-globe-clip)"/>
  <!-- Prime meridian — bold -->
  <line x1="256" y1="120" x2="256" y2="424" stroke="#C5A55A" stroke-width="4" opacity="0.5" clip-path="url(#os-globe-clip)"/>

  <!-- Orbital path — thick, glowing ellipse -->
  <ellipse cx="256" cy="256" rx="224" ry="76"
           fill="none" stroke="#C5A55A" stroke-width="5" opacity="0.55"
           transform="rotate(-28 256 256)" filter="url(#os-glow)"/>

  <!-- ===== SATELLITE — large, prominent ===== -->
  <g transform="translate(392, 104) rotate(62)">
    <!-- Solar panel glow -->
    <rect x="-56" y="-12" width="112" height="24" rx="4" fill="rgba(197,165,90,0.3)" filter="url(#os-glow-strong)"/>
    <!-- Left solar panel — solid gold -->
    <rect x="-54" y="-11" width="34" height="22" rx="3" fill="#C5A55A"/>
    <line x1="-46" y1="-11" x2="-46" y2="11" stroke="#0d0118" stroke-width="2.5"/>
    <line x1="-37" y1="-11" x2="-37" y2="11" stroke="#0d0118" stroke-width="2.5"/>
    <line x1="-28" y1="-11" x2="-28" y2="11" stroke="#0d0118" stroke-width="2.5"/>
    <!-- Right solar panel — solid gold -->
    <rect x="20" y="-11" width="34" height="22" rx="3" fill="#C5A55A"/>
    <line x1="28" y1="-11" x2="28" y2="11" stroke="#0d0118" stroke-width="2.5"/>
    <line x1="37" y1="-11" x2="37" y2="11" stroke="#0d0118" stroke-width="2.5"/>
    <line x1="46" y1="-11" x2="46" y2="11" stroke="#0d0118" stroke-width="2.5"/>
    <!-- Panel connectors -->
    <rect x="-20" y="-5" width="40" height="10" rx="2" fill="#ffe085"/>
    <!-- Main body — bright gold -->
    <rect x="-16" y="-13" width="32" height="26" rx="5" fill="#ffe085"/>
    <!-- Body detail -->
    <rect x="-10" y="-7" width="20" height="14" rx="3" fill="#C5A55A"/>
    <!-- Antenna -->
    <line x1="0" y1="-13" x2="0" y2="-28" stroke="#ffe085" stroke-width="3.5"/>
    <circle cx="0" cy="-31" r="4.5" fill="#ffe085"/>
  </g>

  <!-- Satellite glow halo -->
  <circle cx="392" cy="104" r="36" fill="rgba(255,224,133,0.18)" filter="url(#os-glow-strong)"/>

  <!-- Scan beam — visible dashed lines -->
  <line x1="378" y1="128" x2="310" y2="228" stroke="#C5A55A" stroke-width="3" opacity="0.45" stroke-dasharray="8 5"/>
  <line x1="378" y1="128" x2="352" y2="240" stroke="#C5A55A" stroke-width="3" opacity="0.45" stroke-dasharray="8 5"/>

  <!-- Target crosshair — bold, vivid -->
  <circle cx="330" cy="308" r="24" fill="none" stroke="#ffe085" stroke-width="5" filter="url(#os-glow)"/>
  <circle cx="330" cy="308" r="8"  fill="#ffe085"/>
  <line x1="330" y1="278" x2="330" y2="292" stroke="#ffe085" stroke-width="5"/>
  <line x1="330" y1="324" x2="330" y2="338" stroke="#ffe085" stroke-width="5"/>
  <line x1="300" y1="308" x2="314" y2="308" stroke="#ffe085" stroke-width="5"/>
  <line x1="346" y1="308" x2="360" y2="308" stroke="#ffe085" stroke-width="5"/>
</svg>
