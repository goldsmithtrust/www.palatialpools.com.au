<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palatial Pools - Redirecting...</title>
  <style>
    body { word-wrap: break-word; overflow-wrap: break-word; max-width: 100vw; overflow-x: hidden;
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0f1e; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 40px; max-width: 420px; text-align: center; }
    .logo { font-size: 24px; font-weight: 700; color: #4fc3f7; margin-bottom: 8px; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 24px; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(79,195,247,0.2); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 20px; }
    a { color: #4fc3f7; }
  </style>
  <script>
    // Check expiry (2 hours from token creation)
    var expires = new Date('2026-04-16T08:40:00+10:00').getTime();
    if (Date.now() > expires) {
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('.subtitle').textContent = 'This access link has expired.';
      });
    } else {
      setTimeout(function() { window.location.href = '/'; }, 1500);
    }
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">Palatial Pools</div>
    <div class="subtitle">Verifying access...</div>
    <div class="spinner"></div>
    <p>You'll be redirected to the site momentarily.</p>
    <div class="info">Temporary access valid until 6:40 AM AEST, 16 Apr 2026<br>
    If not redirected, <a href="/">click here</a></div>
  </div>
</body>
</html>
