name: Auto deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEFAULT_DEPLOY_HOST: "134.199.170.44"
  DEFAULT_DEPLOY_USER: "deploy"
  DEFAULT_DEPLOY_PORT: "22"
  DEFAULT_DEPLOY_PATH: "/opt/palatial-pools-website"
  DEFAULT_DEPLOY_SERVICE: "palatial-pools-website"
  DEFAULT_HEALTHCHECK_URL: "https://palatialpools.com.au/"

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment configuration
        id: config
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_SECRET: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_SECRET: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT_SECRET: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
          HEALTHCHECK_URL_SECRET: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail

          host="${DEPLOY_HOST_SECRET:-$DEFAULT_DEPLOY_HOST}"
          user="${DEPLOY_USER_SECRET:-$DEFAULT_DEPLOY_USER}"
          port="${DEPLOY_PORT_SECRET:-$DEFAULT_DEPLOY_PORT}"
          path="${DEPLOY_PATH_SECRET:-$DEFAULT_DEPLOY_PATH}"
          health="${HEALTHCHECK_URL_SECRET:-$DEFAULT_HEALTHCHECK_URL}"

          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::notice::DEPLOY_SSH_KEY is not configured, so this deployment run is being skipped. Add the required deployment secrets to enable automatic deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "health=$health" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ steps.config.outputs.host }}
          DEPLOY_PORT: ${{ steps.config.outputs.port }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote release directory
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.host }}
          DEPLOY_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PORT: ${{ steps.config.outputs.port }}
          DEPLOY_PATH: ${{ steps.config.outputs.path }}
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$remote" \
            "mkdir -p '$DEPLOY_PATH/releases' '$DEPLOY_PATH/shared' '$release_dir'"

      - name: Upload repository to server release
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.host }}
          DEPLOY_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PORT: ${{ steps.config.outputs.port }}
          DEPLOY_PATH: ${{ steps.config.outputs.path }}
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="$DEPLOY_PATH/releases/$GITHUB_SHA"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/cache/' \
            --exclude='.env' \
            --exclude='data/' \
            ./ "$remote:$release_dir/"

      - name: Install, build, activate, and restart on server
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ steps.config.outputs.host }}
          DEPLOY_USER: ${{ steps.config.outputs.user }}
          DEPLOY_PORT: ${{ steps.config.outputs.port }}
          DEPLOY_PATH: ${{ steps.config.outputs.path }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          DEPLOY_RESTART_COMMAND: ${{ secrets.DEPLOY_RESTART_COMMAND }}
        run: |
          set -euo pipefail
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          service="${DEPLOY_SERVICE:-$DEFAULT_DEPLOY_SERVICE}"
          restart_b64="$(printf '%s' "${DEPLOY_RESTART_COMMAND:-}" | base64 -w0)"

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$remote" \
            "DEPLOY_PATH='$DEPLOY_PATH' GITHUB_SHA='$GITHUB_SHA' DEPLOY_SERVICE='$service' DEPLOY_RESTART_COMMAND_B64='$restart_b64' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          release_dir="$DEPLOY_PATH/releases/$GITHUB_SHA"
          current_link="$DEPLOY_PATH/current"
          shared_env="$DEPLOY_PATH/shared/.env"
          restart_command="$(printf '%s' "$DEPLOY_RESTART_COMMAND_B64" | base64 -d)"

          cd "$release_dir"

          if [ -f "$shared_env" ]; then
            ln -sfn "$shared_env" "$release_dir/.env"
          elif [ -f "$current_link/.env" ]; then
            cp "$current_link/.env" "$release_dir/.env"
          fi

          install_js_deps() {
            if [ -f pnpm-lock.yaml ]; then
              corepack enable >/dev/null 2>&1 || true
              pnpm install --frozen-lockfile
            elif [ -f yarn.lock ]; then
              corepack enable >/dev/null 2>&1 || true
              yarn install --frozen-lockfile
            elif [ -f package-lock.json ]; then
              npm ci
            elif [ -f package.json ]; then
              npm install
            fi
          }

          has_npm_script() {
            node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)" "$1"
          }

          if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
            if [ -f client/package.json ]; then
              (cd client && install_js_deps && if [ -f package.json ] && has_npm_script build; then npm run build; fi)
            fi
            ln -sfn "$release_dir" "$current_link"
            cd "$current_link"
            if [ -n "$restart_command" ]; then
              bash -lc "$restart_command"
            else
              docker compose up -d --build
            fi
          else
            if [ -f package.json ]; then
              install_js_deps
              if has_npm_script build; then npm run build; fi
              if has_npm_script postbuild; then npm run postbuild; fi
            fi
            ln -sfn "$release_dir" "$current_link"
            cd "$current_link"
            if [ -n "$restart_command" ]; then
              bash -lc "$restart_command"
            elif command -v systemctl >/dev/null 2>&1; then
              sudo systemctl restart "$DEPLOY_SERVICE"
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 reload "$DEPLOY_SERVICE" --update-env || pm2 start npm --name "$DEPLOY_SERVICE" -- start
              pm2 save || true
            else
              echo "No restart mechanism found. Configure DEPLOY_RESTART_COMMAND for this repository." >&2
              exit 1
            fi
          fi

          printf '%s\n' "$GITHUB_SHA" > "$DEPLOY_PATH/REVISION"
          find "$DEPLOY_PATH/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | awk 'NR>5 {print $2}' | xargs -r rm -rf
          REMOTE_SCRIPT

      - name: Health check
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          HEALTHCHECK_URL: ${{ steps.config.outputs.health }}
        run: |
          set -euo pipefail
          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$HEALTHCHECK_URL" >/dev/null
          fi
